name: Agentic MLOps Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.parse_drift.outputs.drift }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python monitor.py > drift_output.json
      - name: Parse drift output
        id: parse_drift
        run: |
          drift=$(jq -r '.drift_detected' drift_output.json)
          case "$drift" in
            true|false) ;;
            *) echo "Invalid drift_detected value: $drift" >&2; exit 1 ;;
          esac
          echo "drift=$drift" >> "$GITHUB_OUTPUT"

  retrain:
    needs: monitor
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    if: needs.monitor.outputs.drift == 'true'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Train Challenger
        id: train
        run: python retrain.py
      - name: Compare Challenger with Champion and deploy
        env:
          CANDIDATE_VERSION: ${{ steps.train.outputs.candidate_version }}
        run: python compare_models.py "$CANDIDATE_VERSION"
