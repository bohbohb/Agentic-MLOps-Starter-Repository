[project]
name = "agentic-mlops-starter-repository"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.8"
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "scipy==1.12.0",
    "mlflow==2.9.2",
    "setuptools<81",
    "pyarrow==14.0.2",
    "databricks-cli==0.17.6",
    "matplotlib==3.10.8",
    "requests==2.19.0",
    "pip-audit>=2.5.5",
    "snakeviz>=2.2.2",
]

[project.scripts]
agentic-mlops-starter-repository = "agentic_mlops_starter_repository:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.extra-build-dependencies]
pyarrow = ["setuptools"]

